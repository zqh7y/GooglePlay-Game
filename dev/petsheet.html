<!doctype html>
<html><head><meta charset="utf-8"><title>Pet sheet</title>
<style>body{margin:0;background:#f3e6cf;font:12px sans-serif} #g{display:grid;grid-template-columns:repeat(10,170px);gap:4px;padding:8px} .c{text-align:center} canvas{display:block}</style></head>
<body><div id="g"></div><script type="module">
import { PET_LIST } from "/src/data/items.ts";
import { drawPet } from "/src/art/pets.ts";
const g = document.getElementById("g");
// ?frame=1 or ?frame=2 shows the walk frames
const frame = Number(new URLSearchParams(location.search).get("frame") || 0);

for (const p of PET_LIST) {
  const d = document.createElement("div"); d.className = "c";
  const c = document.createElement("canvas"); c.width = 160; c.height = 178;
  drawPet(c.getContext("2d"), p, frame);
  d.append(c, `${p.index} ${p.name}`);
  g.append(d);
}
</script></body></html>
