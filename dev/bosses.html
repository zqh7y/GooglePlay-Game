<!doctype html>
<html><head><meta charset="utf-8"><title>Bosses</title>
<style>body{margin:0;background:#9fd36a;font:16px sans-serif} #g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px} .c{text-align:center;background:rgba(255,255,255,.25);padding:6px;border-radius:8px}</style></head>
<body><div id="g"></div><script type="module">
import { makeCharacterTextures } from "/src/art/characters.ts";
import { makeBossTextures } from "/src/art/bosses.ts";
import { BOSSES, BOSS_EVERY } from "/src/data/bosses.ts";
// draw straight onto canvases through a tiny fake scene
const made = {};
const scene = { textures: { exists: (k) => !!made[k], createCanvas: (k, w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; made[k] = c; return { getContext: () => c.getContext("2d"), refresh() {} }; } } };
makeCharacterTextures(scene);
makeBossTextures(scene);
const g = document.getElementById("g");
BOSSES.forEach((b, i) => {
  const d = document.createElement("div"); d.className = "c"; d.append(made[b.tex], document.createElement("br"), `${i * BOSS_EVERY + 1}-${(i + 1) * BOSS_EVERY}: ${b.name}`); g.append(d);
});
</script></body></html>
